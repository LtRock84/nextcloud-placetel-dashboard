name: Isolated Nextcloud skill integration
on:
  push:
    branches: [skill-zuordnung-test-20261119, release-0.2.9-test]
  workflow_dispatch:
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        image: ['nextcloud:34.0.5-apache', 'nextcloud:35.0.2-apache']
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PLACETEL_DISPOSABLE_TEST: '1'
      PLACETEL_NATIVE_IMAGE: ${{ matrix.image }}
      PLACETEL_NATIVE_FIXTURE_DIR: /tmp/placetel-native-fixture
    steps:
      - uses: actions/checkout@v4
      - name: Test synthetic skill and authorization contracts
        run: |
          php tests/native/skills.php
          php tests/native/skills-api-standalone.php
          php tests/native/rights-standalone.php
      - name: Prepare synthetic fixtures
        run: |
          tar -czf /tmp/placetel-native-app-test.tar.gz placetel
          cp tests/native-parity.json /tmp/native-parity.json
          cp tests/native/contract.php tests/native/run-http.py tests/native/popups.php tests/native/webhook-contract.php tests/native/webhook-router.php /tmp/
      - name: Start isolated Nextcloud
        run: python3 tests/native/setup.py
      - name: Test permissions and agent colors
        run: python3 tests/native/rights-http.py
      - name: Start separate Nextcloud 35 fixture for full contract
        if: matrix.image == 'nextcloud:35.0.2-apache'
        env:
          PLACETEL_NATIVE_NAME: placetel-native351
          PLACETEL_NATIVE_PORT: '44327'
          PLACETEL_NATIVE_FIXTURE_DIR: /tmp/placetel-native351-fixture
        run: python3 tests/native/setup.py
      - name: Test native application on Nextcloud 35
        if: matrix.image == 'nextcloud:35.0.2-apache'
        env:
          PLACETEL_NATIVE_NAME: placetel-native351
          PLACETEL_NATIVE_PORT: '44327'
          PLACETEL_NATIVE_FIXTURE_DIR: /tmp/placetel-native351-fixture
        run: python3 tests/native/verify.py
